apiVersion: 1
groups:
  - orgId: 1
    name: tellscope-mlops
    folder: Tellscope
    interval: 60s
    rules:
      - uid: tellscope-stale-jobs
        title: Хвосты ML-задач без heartbeat
        condition: C
        for: 5m
        noDataState: OK
        execErrState: Error
        annotations:
          summary: В журнале есть running-задачи без свежего heartbeat.
        labels:
          severity: warning
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: prom-internal
            model:
              editorMode: code
              expr: tellscope_jobs_stale
              instant: true
              intervalMs: 1000
              maxDataPoints: 43200
              range: false
              refId: A
          - refId: B
            datasourceUid: __expr__
            model:
              type: reduce
              expression: A
              reducer: last
              intervalMs: 1000
              maxDataPoints: 43200
              refId: B
          - refId: C
            datasourceUid: __expr__
            model:
              type: threshold
              expression: B
              conditions:
                - evaluator:
                    params:
                      - 0
                    type: gt
                  operator:
                    type: and
                  query:
                    params:
                      - C
                  reducer:
                    params: []
                    type: last
                  type: query
              intervalMs: 1000
              maxDataPoints: 43200
              refId: C
      - uid: tellscope-gateway-errors
        title: Ошибки LLM-шлюза
        condition: C
        for: 10m
        noDataState: OK
        execErrState: Error
        annotations:
          summary: За 10 минут накопились ошибки vLLM или AITunnel через mlops.gateway.
        labels:
          severity: warning
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: prom-internal
            model:
              editorMode: code
              expr: sum(increase(tellscope_gateway_errors_total[10m])) or vector(0)
              instant: true
              intervalMs: 1000
              maxDataPoints: 43200
              range: false
              refId: A
          - refId: B
            datasourceUid: __expr__
            model:
              type: reduce
              expression: A
              reducer: last
              intervalMs: 1000
              maxDataPoints: 43200
              refId: B
          - refId: C
            datasourceUid: __expr__
            model:
              type: threshold
              expression: B
              conditions:
                - evaluator:
                    params:
                      - 3
                    type: gt
                  operator:
                    type: and
                  query:
                    params:
                      - C
                  reducer:
                    params: []
                    type: last
                  type: query
              intervalMs: 1000
              maxDataPoints: 43200
              refId: C
      - uid: tellscope-two-heavy-jobs
        title: Два тяжёлых GPU-job одновременно
        condition: C
        for: 2m
        noDataState: OK
        execErrState: Error
        annotations:
          summary: QoS 409 не сработал — на Qwen одновременно больше одного живого batch.
        labels:
          severity: critical
        data:
          - refId: A
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: prom-internal
            model:
              editorMode: code
              expr: tellscope_gpu_holders
              instant: true
              intervalMs: 1000
              maxDataPoints: 43200
              range: false
              refId: A
          - refId: B
            datasourceUid: __expr__
            model:
              type: reduce
              expression: A
              reducer: last
              intervalMs: 1000
              maxDataPoints: 43200
              refId: B
          - refId: C
            datasourceUid: __expr__
            model:
              type: threshold
              expression: B
              conditions:
                - evaluator:
                    params:
                      - 1
                    type: gt
                  operator:
                    type: and
                  query:
                    params:
                      - C
                  reducer:
                    params: []
                    type: last
                  type: query
              intervalMs: 1000
              maxDataPoints: 43200
              refId: C
