version: 1
# Serving lock for tellscope40. Secrets live in .env, not here.
# Image digest taken from docker images --digests on 2026-08-31 (tag latest is not trusted).

generate:
  provider: vllm
  model: Qwen/Qwen3-32B-FP8
  revision: ""
  base_url: http://127.0.0.1:8000
  image: vllm/vllm-openai
  image_tag: latest
  image_digest: sha256:d9a5c1c1614c959fde8d2a4d68449db184572528a6055afdd0caf1e66fb51504
  pipeline_parallel_size: 3
  tensor_parallel_size: 1
  max_model_len: 8192
  gpu: "1,2,3"

embed:
  provider: sentence_transformers
  model: deepvk/USER2-base
  revision: ""
  device: cuda:0
  gpu: "0"

external:
  provider: aitunnel
  base_url: https://api.aitunnel.ru/v1
  profiles:
    mosinform_insights: gpt-4.1-mini
    dashboard_qa: gpt-4.1-mini
    smart_agent_planner: claude-sonnet-4.5
    harness: deepseek-chat

# Модель-оркестратор: планирует шаги и вызывает инструменты Tellscope.
# Значения — ключи MODEL_CHOICES из agent_engine/loop.py (gpt | deepseek | qwen | claude).
# Настройка читается на каждый запуск, поэтому переключается без правки кода и рестарта.
# Переопределения окружением: TELLSCOPE_ORCHESTRATOR, TELLSCOPE_ORCHESTRATOR_FALLBACKS,
# TELLSCOPE_ORCHESTRATOR_PROBE (tools | reachability). Приоритет у окружения.
agent:
  orchestrator: gpt
  orchestrator_fallbacks: [deepseek, qwen]
  orchestrator_probe: tools

# Веса и шкала ранжирования «ключевых сообщений» в analyze_texts (agent_engine/tools_text.py).
# Меняется без правки кода: правка этого файла подхватывается на следующем запуске инструмента
# (кэш чтения привязан к mtime файла), рестарт приложения не требуется.
#   scale: log | sqrt | linear — сжимающая шкала вместо линейной суммы (по умолчанию log);
#   weights — вес поля в сумме weight * f(value):
#       комментарии/репосты/лайки — реальные реакции людей, вес высокий;
#       просмотры/аудитория/аудитория СМИ — потенциал охвата, вес низкий, чтобы сообщество
#       на 2 млн подписчиков с нулём реакций не вытесняло обсуждение;
#       er — намеренно 0: в выгрузке BA ER = commentsCount + likesCount + repostsCount,
#       то есть те же реакции, и в сумме он давал двойной счёт;
#   enabled: false — вовсе не учитывать счётчики (честный откат на оценку/объём/маркеры).
# Переопределение окружением (приоритет выше этого файла):
#   TELLSCOPE_ENGAGEMENT_WEIGHTS="commentsCount=3,repostsCount=4,likesCount=2,er=0"
#   TELLSCOPE_ENGAGEMENT_SCALE=log
#   TELLSCOPE_ENGAGEMENT_ENABLED=true
engagement:
  enabled: true
  scale: log
  weights:
    commentsCount: 3
    repostsCount: 4
    likesCount: 2
    viewsCount: 0.5
    audienceCount: 0.5
    massMediaAudience: 0.5
    er: 0
    duplicateCount: 0.5

prompts:
  mosinform_classify: classify_v1
  mosinform_insights: insights_v1
  llm_topic_label: topic_label_v1
  llm_run_default: llm_run_default_v1
  llm_run_user: llm_run_user
  dashboard_qa: dashboard_qa_v1
  dashboard_qa_raw: dashboard_qa_raw_v1
  dashboard_qa_tonality: dashboard_qa_tonality_v1
  dashboard_qa_graph: dashboard_qa_graph_v1
  dashboard_qa_cluster: dashboard_qa_cluster_v1
  dashboard_qa_media: dashboard_qa_media_v1
  dashboard_qa_voice: dashboard_qa_voice_v1
  dashboard_qa_bot: dashboard_qa_bot_v1
  smart_agent_plan: smart_agent_plan_v1
  smart_agent_intro: smart_agent_intro_v1
  smart_agent_narrative: smart_agent_narrative_v1

# Цены за 1M токенов (USD) — источник правды для учёта расхода LLM.
# Локальный vLLM работает на наших GPU: внешних платежей нет, поэтому цена 0.
# Значения для aitunnel — ориентир по прайсу провайдеров; если aitunnel берёт наценку,
# поправьте цифры здесь, они подхватятся при старте приложения.
pricing:
  vllm:
    "*":
      in: 0.0
      out: 0.0
  aitunnel:
    "*":
      in: 3.0
      out: 15.0
    claude-sonnet-4.5:
      in: 3.0
      out: 15.0
    gpt-4.1-mini:
      in: 0.4
      out: 1.6
    deepseek-chat-v3.1:
      in: 0.27
      out: 1.1

# Быстрое чтение текстов пачками: отдельный профиль vLLM для инструмента analyze_texts
# (agent_engine/tools_text.py через agent_engine/tools_llm.py::_qwen).
# Оркестрация, harness, dashboard_qa и остальные инструменты остаются на generate
# (Qwen3-32B-FP8, порт 8000) — VLLM_BASE_URL переопределять нельзя, он общий.
# Инстанс: /home/docker/vllm/fast-reader.sh {start|stop|restart|status},
# контейнер vllm-fast-reader, GPU 0, слушает только 127.0.0.1:8001.
# Секция читается на каждый запуск (read_lock_fresh), рестарт приложения не нужен:
#   enabled: false          — чтение как раньше, пачками на 32B;
#   fallback_to_generate    — 8001 не отвечает: пачка честно читается на 32B,
#                             запуск не падает и в отчёте видно, что был откат.
texts_bulk:
  provider: vllm
  model: qwen3-4b-fast
  base_url: http://127.0.0.1:8001
  enabled: true
  fallback_to_generate: true
  max_tokens: 3000
  batch_size: 20
  parallel_batches: 8
  max_model_len: 16384
  gpu: "0"
  container: vllm-fast-reader
  compose: /home/docker/vllm/docker-compose-fast-reader-gpu0.yml

# Пороги адаптивного чтения текстов (agent_engine/tools_text.py). Единственное место, где они
# заданы; код читает их на каждом запуске (read_lock_fresh), поэтому правка применяется без
# рестарта приложения. Порогов ровно два, как в задании:
#   warn_read_limit      — с этого размера срез читается целиком, но это долго, и в прогрессе
#                          видно предупреждение (замер: ~450 сообщений в минуту на 12 параллельно);
#   full_read_limit      — до этого размера читаем ВЕСЬ срез целиком быстрой моделью;
#   cluster_min_messages — свыше этого размера локальной моделью весь корпус не прочитать:
#                          кластеры считаются по всему корпусу (эмбеддинги проекта + UMAP/HDBSCAN),
#                          а модель читает представителей кластеров и самые значимые сообщения.
#                          Частоты тем в отчёте — по всему корпусу, цитаты — из прочитанного.
# Параметры кластеризации:
#   cluster_read_limit   — сколько сообщений всего читаем (представители + значимые);
#   cluster_per_cluster  — сколько представителей берём из одного кластера;
#   cluster_top_messages — плюс самые значимые сообщения корпуса;
#   cluster_min_size     — минимальный размер кластера HDBSCAN;
#   cluster_max          — сколько кластеров максимум попадает в отчёт;
#   cluster_embed_batch  — размер пачки при расчёте эмбеддингов корпуса;
#   cluster_text_chars   — сколько символов текста уходит в эмбеддинги (замер: 300 символов дают
#                          ~500 сообщений/с против ~180 на 600 символах при той же структуре);
#   cluster_svd_dims     — сколько измерений оставляем после SVD перед UMAP;
#   cluster_umap_neighbors — соседей UMAP (как в кластеризации датасетов проекта);
#   cluster_corpus_limit — страховочный предел размера корпуса для эмбеддингов;
#   theme_field_prefix   — префикс готовых тем датасета (Brand Analytics): подсказка для названий
#                          кластеров, а не источник частот.
# Переопределение окружением: TELLSCOPE_TEXTS_WARN_LIMIT, TELLSCOPE_TEXTS_FULL_LIMIT,
# TELLSCOPE_TEXTS_CLUSTER_MIN, TELLSCOPE_TEXTS_CLUSTER_READ, TELLSCOPE_TEXTS_CLUSTER_PER и др.
texts:
  warn_read_limit: 5000
  full_read_limit: 20000
  cluster_min_messages: 20000
  cluster_read_limit: 600
  cluster_per_cluster: 8
  cluster_top_messages: 60
  cluster_min_size: 30
  cluster_max: 40
  cluster_embed_batch: 64
  cluster_text_chars: 300
  cluster_svd_dims: 50
  cluster_umap_neighbors: 30
  cluster_corpus_limit: 200000
  theme_field_prefix: "tag_"
