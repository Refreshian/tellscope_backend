[project]
name = "mosinform-rating"
version = "0.1.0"
description = "Ежемесячный рейтинг медиаприсутствия ОИВ Москвы: выгрузки → Excel → PPTX"
requires-python = ">=3.11"
dependencies = [
  "python-pptx>=1.0.0",
  "openpyxl>=3.1.0",
  "pandas>=2.2.0",
  "pyyaml>=6.0",
  "lxml>=5.0",
  "httpx>=0.27.0",
]

[project.scripts]
mosinform = "mosinform.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
mlops = ["lock.yaml", "prompts/*.txt"]

[project.optional-dependencies]
test = ["pytest>=8.0"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
