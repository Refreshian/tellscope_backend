name: mlops-cpu

on:
  push:
    paths:
      - "src/mlops/**"
      - "tests/**"
      - "pyproject.toml"
  pull_request:
    paths:
      - "src/mlops/**"
      - "tests/**"
      - "pyproject.toml"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: CPU tests (no GPU, no live models)
        run: |
          python -m pip install pytest pyyaml
          python -m pytest tests -q
